[project]
name = "rital-ir-project"
version = "0.1.0"
description = "RITAL IR Project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "networkx>=3.4",
    "numpy>=2.0",
    "scikit-learn>=1.6",
]

[project.scripts]
rital-ir-project = "rital_ir_project.cli:main"

[build-system]
requires = ["setuptools>=73.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
