[project]
name = "rital-ir-project"
version = "0.1.0"
description = "RITAL IR Project"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastembed>=0.4.1",
    "future>=1.0.0",
    "graspologic>=3.3.0",
    "huggingface-hub[cli]>=0.36.2",
    "jsonlines>=4.0.0",
    "matplotlib>=3.10.0",
    "nano_vectordb>=0.0.2",
    "neo4j>=5.25.0",
    "nest_asyncio>=1.6.0",
    "networkx>=3.4",
    "numpy>=2.4.4",
    "openai>=1.61.1",
    "pandas>=2.2.3",
    "pydantic>=2.10.6",
    "ragas>=0.2.2",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "setuptools>=73.0.1,<81",
    "tenacity>=9.0.0",
    "tiktoken>=0.12.0",
    "tqdm>=4.66.5",
    "transformers>=4.47.1",
    "umap_learn>=0.5.6",
    "xxhash>=3.5.0",
]

[project.scripts]
rital-ir-project = "rital_ir_project.cli:main"

[build-system]
requires = ["setuptools>=73.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
